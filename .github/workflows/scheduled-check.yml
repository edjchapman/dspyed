name: scheduled-check

on:
  schedule:
    # Mondays 09:00 UTC — catches drift from out-of-band edits (e.g. via GitHub web UI)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  make-check:
    name: make check (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group analysis
      - name: Run make check
        run: make check
